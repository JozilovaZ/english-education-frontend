# English Education — production nginx namunasi.
#
# Bitta frontend build (dist/) barcha domenlarga xizmat qiladi: platforma (example.uz) va
# har bir o'quv markazi (cambridge.example.uz, ...). Qaysi markaz ekanini Django
# (django-tenants) Host header bo'yicha aniqlaydi — shuning uchun Host o'zgarmasdan uzatiladi.
#
# O'rnatish:
#   1. `npm run build` → dist/ ni serverga ko'chiring (masalan /var/www/english-education)
#   2. Shu faylni /etc/nginx/sites-available/ ga qo'ying, `example.uz` va yo'llarni almashtiring
#   3. DNS: example.uz va *.example.uz → shu server; SSL — wildcard sertifikat (DNS-01)
#   4. Django: ALLOWED_HOSTS ga `.example.uz`, SECURE_PROXY_SSL_HEADER (pastga qarang)

upstream django {
    # gunicorn / uvicorn manzili
    server 127.0.0.1:8000;
    keepalive 16;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name example.uz *.example.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.uz *.example.uz;

    ssl_certificate     /etc/letsencrypt/live/example.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.uz/privkey.pem;

    root /var/www/english-education;
    index index.html;

    # Uy vazifasi / imtihon fayllari (backend cheklovi 5 MB; materiallar kattaroq bo'lishi mumkin)
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API: /api/ prefiksi olib tashlanadi (dev'dagi Vite proxy bilan bir xil — vite.config.ts)
    location /api/ {
        proxy_pass http://django/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django fayl havolalarini https bilan qaytarishi uchun (SECURE_PROXY_SSL_HEADER)
        proxy_set_header X-Forwarded-Proto $scheme;
        # Yangi markaz yaratish (schema + migratsiyalar) bir daqiqagacha cho'zilishi mumkin
        proxy_read_timeout 120s;
    }

    # Yuklangan fayllar. Django ularni faqat DEBUG=True da beradi (core/urls.py), shuning uchun
    # production'da nginx diskdan beradi. URL'da markaz papkasi bor (/media/<schema>/...,
    # MULTITENANT_RELATIVE_MEDIA_ROOT) — tenantni aniqlash shart emas
    location /media/ {
        alias /srv/english-education/media/;   # Django MEDIA_ROOT
        expires 7d;
    }

    # Django admin va Swagger uchun statik fayllar (`manage.py collectstatic`)
    location /static/ {
        alias /srv/english-education/staticfiles/;   # Django STATIC_ROOT
        expires 30d;
    }

    # Django admin (kerak bo'lmasa olib tashlang)
    location /admin/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite build fayllari nomida hash bor — abadiy keshlanadi
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: har qanday sahifa (masalan /teacher/attendance) index.html ga tushadi.
    # index.html keshlanmaydi — yangi build darhol ko'rinadi
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}

# Django settings.py (backend) uchun eslatma:
#   ALLOWED_HOSTS = ['.example.uz', 'example.uz']
#   SECURE_PROXY_SSL_HEADER = ('HTTP_X_FORWARDED_PROTO', 'https')
#   CSRF_TRUSTED_ORIGINS = ['https://*.example.uz', 'https://example.uz']
