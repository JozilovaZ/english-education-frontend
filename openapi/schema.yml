                items:
                  $ref: '#/components/schemas/GroupStudent'
          description: ''
  /Educations/groups/statistics/:
    get:
      operationId: Educations_groups_statistics_retrieve
      description: |-
        Guruhlar va o'quvchilar bo'yicha batafsil statistika (faqat Admin va SuperAdmin uchun).
        Statistika quyidagilarni o'z ichiga oladi:
        - Umumiy guruhlar soni
        - Statuslar bo'yicha taqsimot (tugallangan, pauza qilingan, faol, o'quvchilar yig'ilayotgan, bekor qilingan) soni va foizlari
        - O'quvchilar soniga nisbatan statistika (jami o'quvchilar, jami sig'im, bo'sh o'rinlar, to'lganlik darajasi, o'rtacha talabalar soni, to'lgan/bo'sh guruhlar soni)
        - Talabalar soni oraliqlari bo'yicha guruhlar taqsimoti (0 ta, 1-5, 6-10, 11-15, >15)
        - Kurslar bo'yicha guruhlar va talabalar taqsimoti
        - O'qituvchilar bo'yicha guruhlar va talabalar taqsimoti

        Statistikani ixtiyoriy ravishda kurs, o'qituvchi yoki sana oralig'i bo'yicha filtrlash mumkin.
      parameters:
      - in: query
        name: course
        schema:
          type: integer
        description: Statistikani ma'lum bir kurs bo'yicha filtrlash (kurs ID)
      - in: query
        name: start_date_from
        schema:
          type: string
          format: date
        description: Statistikani boshlanish sanasi bo'yicha filtrlash (dan, YYYY-MM-DD)
      - in: query
        name: start_date_to
        schema:
          type: string
          format: date
        description: Statistikani boshlanish sanasi bo'yicha filtrlash (gacha, YYYY-MM-DD)
      - in: query
        name: teacher
        schema:
          type: integer
        description: Statistikani ma'lum bir o'qituvchi bo'yicha filtrlash (o'qituvchi
          ID)
      tags:
      - Groups
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupStatistics'
          description: ''
