openapi: 3.0.3
info:
  title: English Education API
  version: 1.0.0
  description: English Education platform API documentation with JWT authentication
paths:
  /Attendance/:
    get:
      operationId: Attendance_list
      description: Davomat ro'yxati (O'qituvchi o'z guruhi davomatini, talaba esa
        faqat o'z davomatini ko'radi).
      tags:
      - Attendance
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attendance'
          description: ''
    post:
      operationId: Attendance_create
      description: Dars uchun o'quvchi davomatini belgilash (Faqat o'qituvchi o'z
        guruhi uchun qila oladi). Darsga kelmagan yoki kechikkan bo'lsa ota-onasiga
        avtomatik Telegram xabarnoma yuboriladi.
      tags:
      - Attendance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Attendance'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Attendance'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Attendance'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attendance'
          description: ''
  /Attendance/{id}/:
    get:
      operationId: Attendance_retrieve
      description: Bitta davomat qaydi tafsilotlari.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this attendance.
        required: true
      tags:
      - Attendance
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attendance'
          description: ''
    patch:
      operationId: Attendance_partial_update
      description: Davomat holatini qisman yangilash.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this attendance.
        required: true
      tags:
      - Attendance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAttendance'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAttendance'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAttendance'
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attendance'
          description: ''
    delete:
      operationId: Attendance_destroy
      description: Davomat qaydini o'chirish.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this attendance.
        required: true
      tags:
      - Attendance
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /Attendance/bulk-mark/:
    post:
      operationId: Attendance_bulk_mark_create
      description: O'qituvchi butun guruh o'quvchilarining davomatini bitta so'rovda
        belgilashi mumkin. Kelmagan yoki kechikkanlarning ota-onalariga Telegram xabarnoma
        yuboriladi.
      summary: Butun guruh uchun bitta darsda ommaviy davomat qilish
      tags:
      - Attendance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkAttendance'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BulkAttendance'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BulkAttendance'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attendance'
          description: ''
  /Attendance/my-attendance/:
    get:
      operationId: Attendance_my_attendance_retrieve
      description: Talaba faqat o'zining barcha darslardagi davomatini va qatnashish
        statistikasini ko'radi.
      summary: Talabaning o'z davomati va statistikasi
      tags:
      - Attendance
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attendance'
          description: ''
  /Educations/courses/:
    get:
      operationId: Educations_courses_list
      description: Barcha kurslar ro'yxatini olish (qidirish va saralash imkoniyati
        bilan).
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Courses
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Course'
          description: ''
    post:
      operationId: Educations_courses_create
      description: Yangi kurs yaratish.
      tags:
      - Courses
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Course'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Course'
          application/json:
            schema:
              $ref: '#/components/schemas/Course'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
          description: ''
  /Educations/courses/{id}/:
    get:
      operationId: Educations_courses_retrieve
      description: Bitta kurs haqida batafsil ma'lumot olish.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this course.
        required: true
      tags:
      - Courses
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
          description: ''
    patch:
      operationId: Educations_courses_partial_update
      description: Kurs ma'lumotlarini qisman yangilash (PATCH).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this course.
        required: true
      tags:
      - Courses
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCourse'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCourse'
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCourse'
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
          description: ''
    delete:
      operationId: Educations_courses_destroy
      description: Kursni o'chirish.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this course.
        required: true
      tags:
      - Courses
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /Educations/groups/:
    get:
      operationId: Educations_groups_list
      description: |-
        Barcha guruhlar ro'yxatini ko'rish va filtrlash (faqat Admin va SuperAdmin uchun).
        Filtrlar orqali status (tamomlangan, pauza qilingan, faol va h.k.), kurs, o'qituvchi, talabalar soni yoki bo'sh o'rinlar bo'yicha saralash va filtrlash mumkin.
      parameters:
      - in: query
        name: course
        schema:
          type: integer
        description: 'Kurs ID bo''yicha filtrlash: ?course=1'
      - in: query
        name: has_available_seats
        schema:
          type: boolean
        description: 'Bo''sh o''rinlari bor guruhlarni filtrlash (true yoki false):
          ?has_available_seats=true'
      - in: query
        name: is_full
        schema:
          type: boolean
        description: 'To''liq to''lgan guruhlarni filtrlash (true yoki false): ?is_full=true'
      - in: query
        name: max_students
        schema:
          type: integer
        description: 'Guruhdagi maksimal talabalar soni: ?max_students=15'
      - in: query
        name: min_students
        schema:
          type: integer
        description: 'Guruhdagi minimal talabalar soni: ?min_students=5'
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: start_date_from
        schema:
          type: string
          format: date
        description: 'Guruh boshlanish sanasi (dan, YYYY-MM-DD): ?start_date_from=2026-01-01'
      - in: query
        name: start_date_to
        schema:
          type: string
          format: date
        description: 'Guruh boshlanish sanasi (gacha, YYYY-MM-DD): ?start_date_to=2026-12-31'
      - in: query
        name: status
        schema:
          type: string
        description: 'Guruh holati bo''yicha filtrlash (recruiting, active, completed,
          cancelled, paused). Vergul bilan bir nechta yozish ham mumkin: ?status=completed,paused'
      - in: query
        name: teacher
        schema:
          type: integer
        description: 'O''qituvchi ID bo''yicha filtrlash: ?teacher=5'
      tags:
      - Groups
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
          description: ''
    post:
      operationId: Educations_groups_create
      description: Yangi guruh yaratish (faqat Admin va SuperAdmin uchun).
      tags:
      - Groups
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Group'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Group'
          application/json:
            schema:
              $ref: '#/components/schemas/Group'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
          description: ''
  /Educations/groups/{id}/:
    get:
      operationId: Educations_groups_retrieve
      description: Bitta guruh haqida batafsil ma'lumot ko'rish (faqat Admin va SuperAdmin
        uchun).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - Groups
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
          description: ''
    patch:
      operationId: Educations_groups_partial_update
      description: Guruh ma'lumotlarini qisman yangilash (PATCH, faqat Admin va SuperAdmin
        uchun. Cancelled va Completed guruhlarni o'zgartirib bo'lmaydi).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - Groups
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedGroup'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedGroup'
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedGroup'
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
          description: ''
  /Educations/groups/{id}/add-student/:
    post:
      operationId: Educations_groups_add_student_create
      description: Guruhga yangi talaba qo'shish (sig'im va talaba holati tekshiriladi).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - Groups
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddStudentToGroup'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddStudentToGroup'
          application/json:
            schema:
              $ref: '#/components/schemas/AddStudentToGroup'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /Educations/groups/{id}/remove-student/:
    post:
      operationId: Educations_groups_remove_student_create
      description: Guruhdan talabani chiqarish (left_at sanasi saqlanadi).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - Groups
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RemoveStudentFromGroup'
          application/x-www-form-urlencoded:
