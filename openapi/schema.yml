        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Groups
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
