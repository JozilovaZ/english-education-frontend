components:
  schemas:
    AddStudentToGroup:
      type: object
      description: Guruhga talaba qo'shish uchun serializer.
      properties:
        student_id:
          type: integer
          description: Guruhga qo'shilayotgan talaba (User) ID si
      required:
      - student_id
    Attendance:
      type: object
      description: |-
        Attendance (Davomat) modeli uchun asosiy serializer.
        - Faqat o'qituvchi davomat qila oladi.
        - O'qituvchi faqat o'zining guruhi uchun davomat qila oladi.
        - Talaba aynan shu guruh talabasi bo'lishi shart.
      properties:
        id:
          type: integer
          readOnly: true
        lesson:
          type: integer
        lesson_title:
          type: string
          readOnly: true
        group_id:
          type: integer
          readOnly: true
        group_name:
          type: string
          readOnly: true
        student:
          type: integer
        student_name:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/StatusF1cEnum'
        status_display:
          type: string
          readOnly: true
        note:
          type: string
        marked_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - group_id
      - group_name
      - id
      - lesson
      - lesson_title
      - marked_at
      - status_display
      - student
      - student_name
    BulkAttendance:
      type: object
      description: Butun guruh uchun bitta darsda ommaviy (bulk) davomat qilish serializeri.
      properties:
        lesson:
          type: integer
        attendances:
          type: array
          items:
            $ref: '#/components/schemas/BulkAttendanceItem'
      required:
      - attendances
      - lesson
    BulkAttendanceItem:
      type: object
      properties:
        student:
          type: integer
        status:
          allOf:
          - $ref: '#/components/schemas/StatusF1cEnum'
          default: absent
        note:
          type: string
          default: ''
      required:
      - student
    ChangePassword:
      type: object
      description: |-
        Parolni o'zgartirish uchun serializer.
        new_password va new_password_confirm talab qilinadi.
        Ixtiyoriy ravishda old_password ham tekshirilishi mumkin.
      properties:
        old_password:
          type: string
          writeOnly: true
          description: Eski parol (ixtiyoriy, agar kiritilsa tekshiriladi)
        new_password:
          type: string
          writeOnly: true
          description: Yangi parol
        new_password_confirm:
          type: string
          writeOnly: true
          description: Yangi parolni tasdiqlash
      required:
      - new_password
      - new_password_confirm
    ClientCreate:
      type: object
      description: |-
        Yangi o'quv markazi (Tenant) yaratish uchun serializer.
        Avtomatik ravishda postgresql schema ochadi, ixtiyoriy ravishda domenni va
        dastlabki markaz administratorini (Tenant Admin) yaratib beradi.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        schema_name:
          type: string
          maxLength: 63
        paid_until:
          type: string
          format: date
        on_trial:
          type: boolean
        domain:
          type: string
          description: 'Tenant uchun asosiy domen (masalan: cambridge.localhost yoki
            cambridge.uz)'
          maxLength: 253
        admin_username:
          type: string
          description: Ushbu tenant uchun yaratiladigan admin login (username)
          maxLength: 150
        admin_password:
          type: string
          writeOnly: true
          description: Tenant admin paroli
          maxLength: 128
        admin_phone:
          type: string
          description: 'Tenant admin telefon raqami (masalan: +998901234567)'
          maxLength: 20
        admin_email:
          description: Tenant admin emaili
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
      required:
      - id
      - name
      - on_trial
      - paid_until
      - schema_name
    ClientDomainNested:
      type: object
      description: Client ichida ko'rinadigan qisqa domen ma'lumoti.
      properties:
        id:
          type: integer
          readOnly: true
        domain:
          type: string
          maxLength: 253
        is_primary:
          type: boolean
      required:
      - domain
      - id
    ClientListRetrieve:
      type: object
      description: O'quv markazlari (Tenantlar) ro'yxati va batafsil ma'lumotlarini
        olish uchun serializer.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        schema_name:
          type: string
          readOnly: true
        paid_until:
          type: string
          format: date
          readOnly: true
        on_trial:
          type: boolean
          readOnly: true
        created_on:
          type: string
          format: date
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        status:
          type: string
          readOnly: true
        days_left:
          type: integer
          readOnly: true
        primary_domain:
          type: string
          nullable: true
          readOnly: true
        domains:
          type: array
          items:
            $ref: '#/components/schemas/ClientDomainNested'
          readOnly: true
        users_count:
          type: integer
          readOnly: true
        users_by_role:
          type: object
          additionalProperties: {}
          readOnly: true
      required:
      - created_on
      - days_left
      - domains
      - id
      - is_active
      - name
      - on_trial
      - paid_until
      - primary_domain
      - schema_name
      - status
      - users_by_role
      - users_count
    ClientUpdate:
      type: object
      description: |-
        Mavjud o'quv markazini (Tenant) tahrirlash serializeri.
        (Eslatma: schema_name o'zgartirilmaydi).
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
