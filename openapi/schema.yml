          application/json:
            schema:
              $ref: '#/components/schemas/RemoveStudentFromGroup'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /Educations/groups/{id}/students/:
    get:
      operationId: Educations_groups_students_list
      description: Guruhdagi talabalar ro'yxatini ko'rish (faqat Admin va SuperAdmin
        uchun).
      parameters:
